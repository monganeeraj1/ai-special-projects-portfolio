name: Aviation AI prototype — tests and pipeline

on:
  push:
    paths:
      - "projects/00_aviation_ai_value_platform/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/aviation-ai-ci.yml"
  pull_request:
    paths:
      - "projects/00_aviation_ai_value_platform/**"
      - "requirements.txt"
      - "requirements-dev.txt"

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/00_aviation_ai_value_platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r ../../requirements.txt -r ../../requirements-dev.txt

      # 42 tests: feature-contract / leakage guards, simulator invariants,
      # lift over baselines, interval calibration, Shapley efficiency,
      # attribution vs ground truth, ranking-policy ordering, drift signatures.
      - name: Run test suite
        run: python -m pytest -q

      - name: Run end-to-end pipeline (writes RESULTS.md)
        run: python -m fuelops

      - name: Show whether the committed RESULTS.md matches this run (informational)
        continue-on-error: true
        run: |
          # RESULTS.md is generated. Library-version differences can move the
          # last decimal, so this is a visible diff, not a gate.
          git diff --ignore-matching-lines='^\*Generated by' --stat --exit-code -- RESULTS.md \
            && echo "RESULTS.md is in sync with the code."

      - name: Upload run outputs
        uses: actions/upload-artifact@v4
        with:
          name: aviation-ai-outputs
          path: |
            projects/00_aviation_ai_value_platform/RESULTS.md
            projects/00_aviation_ai_value_platform/outputs/metrics.json
            projects/00_aviation_ai_value_platform/outputs/prioritized_interventions.csv
