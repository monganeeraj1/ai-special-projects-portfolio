<rect x="542" y="726" width="480" height="106" rx="2" fill="#e9eef6"/><text x="566" y="760" font-family="Arial" font-size="14" font-weight="700" fill="#607f96">MODEL / PRODUCT PRINCIPLE</text><text x="566" y="792" font-family="Arial" font-size="17" font-weight="700" fill="#152635">Technical output must connect to workflow.</text><text x="566" y="818" font-family="Arial" font-size="14" fill="#52606c">A model milestone alone is not a business milestone.</text>
