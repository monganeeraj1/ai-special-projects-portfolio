<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#ffffff"/>
<text x="58" y="34" font-family="Arial" font-size="11" font-weight="700" letter-spacing="1.5" fill="#7b6a4b">AI FUEL EFFICIENCY PROGRAM | GOVERNANCE &amp; RISK</text>
<text x="58" y="68" font-family="Arial" font-size="24" font-weight="700" fill="#1d252b">The critical implementation risks sat at the intersection of data timing, causal interpretation, workflow integration and benefits attribution</text>
<line x1="58" y1="91" x2="1542" y2="91" stroke="#b2915f" stroke-width="2"/>

<g font-family="Arial">
<text x="58" y="132" font-size="14" font-weight="700" fill="#4e555b">RISK / DECISION LOG — EXECUTIVE CUT</text>
<rect x="58" y="158" width="1484" height="544" fill="#ffffff" stroke="#cfd3d6"/>
<rect x="58" y="158" width="1484" height="48" fill="#f3f2ef"/>
<text x="82" y="189" font-size="12" font-weight="700" fill="#6a7075">THEME</text>
<text x="310" y="189" font-size="12" font-weight="700" fill="#6a7075">MANAGEMENT QUESTION</text>
<text x="830" y="189" font-size="12" font-weight="700" fill="#6a7075">WHY IT MATTERS</text>
<text x="1240" y="189" font-size="12" font-weight="700" fill="#6a7075">CONTROL / DECISION</text>

<g font-size="14" fill="#37434b">
<text x="82" y="250" font-weight="700">Data timing</text>
<text x="310" y="250">Is the signal available before the decision?</text>
<text x="830" y="250">Post-event data creates leakage / no action window</text>
<text x="1240" y="250">Point-in-time feature contract</text>
<line x1="82" y1="278" x2="1515" y2="278" stroke="#e2e4e6"/>

<text x="82" y="331" font-weight="700">Causality</text>
<text x="310" y="331">Is the model surfacing a controllable lever?</text>
<text x="830" y="331">Prediction alone cannot justify intervention</text>
<text x="1240" y="331">Human review + intervention logic</text>
<line x1="82" y1="359" x2="1515" y2="359" stroke="#e2e4e6"/>

<text x="82" y="412" font-weight="700">Workflow</text>
<text x="310" y="412">Who receives the output and when?</text>
<text x="830" y="412">Late / unclear recommendations will not be adopted</text>
<text x="1240" y="412">Decision point + action owner</text>
<line x1="82" y1="440" x2="1515" y2="440" stroke="#e2e4e6"/>

<text x="82" y="493" font-weight="700">User burden</text>
<text x="310" y="493">How many recommendations can operations absorb?</text>
<text x="830" y="493">False positives create alert fatigue</text>
<text x="1240" y="493">Threshold + prioritization policy</text>
<line x1="82" y1="521" x2="1515" y2="521" stroke="#e2e4e6"/>

<text x="82" y="574" font-weight="700">Benefits</text>
<text x="310" y="574">How will incremental savings be attributed?</text>
<text x="830" y="574">Modelled opportunity can overstate realized value</text>
<text x="1240" y="574">Baseline + benefits methodology</text>
<line x1="82" y1="602" x2="1515" y2="602" stroke="#e2e4e6"/>

<text x="82" y="655" font-weight="700">Ownership</text>
<text x="310" y="655">Who owns the capability after implementation?</text>
<text x="830" y="655">No BAU owner means value decays after launch</text>
<text x="1240" y="655">Operating model + monitoring owner</text>
</g>

<text x="58" y="752" font-size="14" font-weight="700" fill="#4e555b">GOVERNANCE PRINCIPLE</text>
<rect x="58" y="776" width="1484" height="62" fill="#f5f4f1" stroke="#dad7d1"/>
<text x="82" y="813" font-size="15" font-weight="700" fill="#1d252b">Escalate decisions that change value, risk or implementation readiness; keep working-level problem solving out of executive forums.</text>
</g>

<line x1="55" y1="850" x2="1545" y2="850" stroke="#c9ced2" stroke-width="1"/>
<text x="58" y="878" font-family="Arial" font-size="11" fill="#6b737a">AI Fuel Efficiency Program</text>
<text x="800" y="878" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" letter-spacing="1.6" fill="#4e555b">CONFIDENTIAL</text>
<text x="1542" y="878" text-anchor="end" font-family="Arial" font-size="11" fill="#6b737a">5</text>
</svg>