<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#ffffff"/>
<text x="58" y="34" font-family="Arial" font-size="11" font-weight="700" letter-spacing="1.5" fill="#7b6a4b">AI FUEL EFFICIENCY PROGRAM | USE-CASE PRIORITIZATION</text>
<text x="58" y="68" font-family="Arial" font-size="24" font-weight="700" fill="#1d252b">Fuel-efficiency opportunities were screened on value, AI advantage, data readiness and ability to change an operating decision</text>
<line x1="58" y1="91" x2="1542" y2="91" stroke="#b2915f" stroke-width="2"/>

<g font-family="Arial">
<text x="58" y="132" font-size="14" font-weight="700" fill="#4e555b">PRIORITIZATION QUESTIONS USED TO MOVE FROM IDEA TO INVESTABLE USE CASE</text>
<rect x="58" y="158" width="900" height="520" fill="#ffffff" stroke="#cfd3d6"/>
<rect x="58" y="158" width="900" height="46" fill="#f3f2ef"/>
<text x="82" y="188" font-size="12" font-weight="700" fill="#6a7075">LENS</text>
<text x="300" y="188" font-size="12" font-weight="700" fill="#6a7075">QUESTION</text>
<text x="760" y="188" font-size="12" font-weight="700" fill="#6a7075">EVIDENCE NEEDED</text>

<g font-size="14" fill="#37434b">
<text x="82" y="244" font-weight="700">Business value</text><text x="300" y="244">Is the underlying fuel opportunity material?</text><text x="760" y="244">Baseline + unit economics</text>
<line x1="82" y1="267" x2="930" y2="267" stroke="#e2e4e6"/>
<text x="82" y="311" font-weight="700">AI advantage</text><text x="300" y="311">Does AI improve the decision vs. existing rules?</text><text x="760" y="311">Decision / model hypothesis</text>
<line x1="82" y1="334" x2="930" y2="334" stroke="#e2e4e6"/>
<text x="82" y="378" font-weight="700">Data readiness</text><text x="300" y="378">Are signals available at the point of decision?</text><text x="760" y="378">Source / timing / quality</text>
<line x1="82" y1="401" x2="930" y2="401" stroke="#e2e4e6"/>
<text x="82" y="445" font-weight="700">Actionability</text><text x="300" y="445">Can the operation act on the model output?</text><text x="760" y="445">Controllable lever + owner</text>
<line x1="82" y1="468" x2="930" y2="468" stroke="#e2e4e6"/>
<text x="82" y="512" font-weight="700">Implementation</text><text x="300" y="512">Can it fit existing systems and workflows?</text><text x="760" y="512">Integration / process change</text>
<line x1="82" y1="535" x2="930" y2="535" stroke="#e2e4e6"/>
<text x="82" y="579" font-weight="700">Adoption</text><text x="300" y="579">Will users trust and act on the recommendation?</text><text x="760" y="579">UX / decision rights / change</text>
<line x1="82" y1="602" x2="930" y2="602" stroke="#e2e4e6"/>
<text x="82" y="646" font-weight="700">Scalability</text><text x="300" y="646">Can the capability extend beyond the first pilot?</text><text x="760" y="646">Architecture + ownership model</text>
</g>

<text x="1000" y="132" font-size="14" font-weight="700" fill="#4e555b">PRIORITY USE-CASE DEFINITION</text>
<rect x="1000" y="158" width="542" height="520" fill="#faf9f7" stroke="#cfd3d6"/>
<text x="1028" y="199" font-size="12" font-weight="700" letter-spacing="1.2" fill="#8a714e">AI-ENABLED FUEL EFFICIENCY</text>
<text x="1028" y="236" font-size="20" font-weight="700" fill="#1d252b">Turn operational data into targeted decision support</text>

<text x="1028" y="286" font-size="12" font-weight="700" fill="#6a7075">BUSINESS OUTCOME</text>
<text x="1028" y="312" font-size="14" fill="#37434b">Identify avoidable fuel opportunity and improve operating decisions</text>

<text x="1028" y="358" font-size="12" font-weight="700" fill="#6a7075">AI ROLE</text>
<text x="1028" y="384" font-size="14" fill="#37434b">Prioritize where an intervention may be valuable</text>

<text x="1028" y="430" font-size="12" font-weight="700" fill="#6a7075">REQUIRED DESIGN</text>
<text x="1028" y="456" font-size="14" fill="#37434b">Prediction + explainability + controllability + decision rules</text>

<text x="1028" y="502" font-size="12" font-weight="700" fill="#6a7075">WORKFLOW CHANGE</text>
<text x="1028" y="528" font-size="14" fill="#37434b">Surface an actionable recommendation at the right decision point</text>

<text x="1028" y="574" font-size="12" font-weight="700" fill="#6a7075">VALUE LOGIC</text>
<text x="1028" y="600" font-size="14" fill="#37434b">Opportunity × actionability × adoption × realized fuel impact</text>

<text x="1028" y="646" font-size="12" font-weight="700" fill="#6a7075">KEY RISK</text>
<text x="1028" y="672" font-size="14" fill="#37434b">Predictive signal does not automatically imply a causal lever</text>

<rect x="58" y="716" width="1484" height="76" fill="#f5f4f1" stroke="#dad7d1"/>
<text x="82" y="746" font-size="12" font-weight="700" fill="#6a7075">OUTPUT OF THIS STEP</text>
<text x="82" y="775" font-size="16" font-weight="700" fill="#1d252b">A small set of AI opportunities with a defensible value thesis, explicit requirements and a clear path to implementation.</text>
</g>

<line x1="55" y1="850" x2="1545" y2="850" stroke="#c9ced2" stroke-width="1"/>
<text x="58" y="878" font-family="Arial" font-size="11" fill="#6b737a">AI Fuel Efficiency Program</text>
<text x="800" y="878" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" letter-spacing="1.6" fill="#4e555b">CONFIDENTIAL</text>

<text data-watermark="confidential" x="800" y="522" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="160" font-weight="700" letter-spacing="10" fill="#5d6670" opacity="0.085" transform="rotate(-24 800 522)">CONFIDENTIAL</text>
</svg>