<text x="860" y="735" font-family="Arial" font-size="18" font-weight="700" fill="#152635">Decision rule</text>
<rect x="860" y="758" width="680" height="72" rx="12" fill="#1a2632"/>
<text x="890" y="790" font-family="Arial" font-size="17" fill="#fff">Do not fund AI because it is interesting.</text>
<text x="890" y="816" font-family="Arial" font-size="17" font-weight="700" fill="#8fd2c9">Fund it when AI creates a better decision and there is a path to realized value.</text>
<text x="58" y="873" font-family="Arial" font-size="12" fill="#7b8791">The labels A–E are illustrative and do not identify confidential Etihad use cases.</text>
