<text x="58" y="135" font-family="Arial" font-size="17" fill="#52606c">Prioritize AI where value, feasibility and operational actionability intersect</text>

<g font-family="Arial">
<polygon points="80,195 770,195 690,300 160,300" fill="#dcebe7"/><text x="220" y="245" font-size="26" font-weight="700" fill="#153947">Opportunity landscape</text><text x="270" y="275" font-size="14" fill="#52606c">Operational pain points · value pools · decision gaps</text>
