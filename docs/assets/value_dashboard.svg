
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810">
<rect width="1440" height="810" fill="#f5f8fb"/><rect width="1440" height="84" fill="#10233b"/>
<text x="55" y="52" font-family="Arial" font-size="28" font-weight="700" fill="#fff">AI Value Realization — Illustrative Scenario Model</text><text x="1075" y="50" font-family="Arial" font-size="16" fill="#a9bed4">NOT CLIENT FIGURES</text>
<text x="55" y="130" font-family="Arial" font-size="18" font-weight="700" fill="#10233b">Net annual value by scenario</text>
<line x1="140" y1="575" x2="830" y2="575" stroke="#6f8092" stroke-width="2"/>
<line x1="140" y1="185" x2="140" y2="575" stroke="#6f8092" stroke-width="2"/>
<rect x="220" y="575" width="120" height="55" fill="#ff8b8b"/><text x="226" y="655" font-family="Arial" font-size="15" fill="#33495f">Downside</text><text x="218" y="682" font-family="Arial" font-size="16" font-weight="700" fill="#b33939">-AED 1.39M</text>
<rect x="430" y="438" width="120" height="137" fill="#65d6c6"/><text x="455" y="605" font-family="Arial" font-size="15" fill="#33495f">Base</text><text x="438" y="632" font-family="Arial" font-size="16" font-weight="700" fill="#1e6c61">AED 3.80M</text>
<rect x="640" y="225" width="120" height="350" fill="#7aa7ff"/><text x="659" y="605" font-family="Arial" font-size="15" fill="#33495f">Upside</text><text x="642" y="632" font-family="Arial" font-size="16" font-weight="700" fill="#315ea8">AED 15.32M</text>
<rect x="900" y="150" width="450" height="500" rx="12" fill="#fff" stroke="#d8e2ec"/>
<text x="935" y="195" font-family="Arial" font-size="18" font-weight="700" fill="#10233b">Value waterfall</text>
<g font-family="Arial" font-size="16" fill="#20364d">
<text x="935" y="245">1. Eligible operations</text><text x="1270" y="245" text-anchor="end" font-weight="700">50%</text>
<line x1="935" y1="262" x2="1315" y2="262" stroke="#edf1f5"/>
<text x="935" y="305">2. Prioritized for action</text><text x="1270" y="305" text-anchor="end" font-weight="700">20%</text>
<line x1="935" y1="322" x2="1315" y2="322" stroke="#edf1f5"/>
<text x="935" y="365">3. Operator adoption</text><text x="1270" y="365" text-anchor="end" font-weight="700">70%</text>
<line x1="935" y1="382" x2="1315" y2="382" stroke="#edf1f5"/>
<text x="935" y="425">4. Realization rate</text><text x="1270" y="425" text-anchor="end" font-weight="700">50%</text>
<line x1="935" y1="442" x2="1315" y2="442" stroke="#edf1f5"/>
<text x="935" y="485">5. Average avoidable fuel</text><text x="1270" y="485" text-anchor="end" font-weight="700">400 kg</text>
<line x1="935" y1="502" x2="1315" y2="502" stroke="#edf1f5"/>
<text x="935" y="545">Gross value</text><text x="1270" y="545" text-anchor="end" font-weight="700">AED 6.30M</text>
<text x="935" y="585">Run cost</text><text x="1270" y="585" text-anchor="end" font-weight="700">AED 2.50M</text>
<text x="935" y="625" font-weight="700">Net value</text><text x="1270" y="625" text-anchor="end" font-weight="700" fill="#1e6c61">AED 3.80M</text>
</g>
<text x="55" y="760" font-family="Arial" font-size="13" fill="#718398">Illustrative assumptions only. The point is the value chain from model opportunity to actionability, adoption, realized impact and run cost.</text>
</svg>
